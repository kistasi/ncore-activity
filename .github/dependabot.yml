version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The default of 5 is easily filled by one release wave of majors.
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine bumps; majors still come one at a time.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors the Next.js lint toolchain can't take yet: eslint-config-next's
      # bundled eslint-plugin-react crashes on ESLint 10, and typescript-eslint
      # rejects TypeScript 7. Drop these once those catch up.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
